name: Repo Hygiene

# Single visible entrypoint for the org-wide repo-hygiene policy. Delegates to
# the org-owned reusable, which evaluates nwarila-platform/.github's repo_hygiene.rego
# (SHA-pinned uses:, exact dependency pins where applicable, pull_request_target
# safety) against this repo's checked-out tree. No local policy file or
# input-builder is mirrored here - the reusable sources both from
# nwarila-platform/.github at source_ref.

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repo-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: repo-hygiene
    permissions:
      contents: read
    uses: nwarila-platform/.github/.github/workflows/reusable-repo-hygiene.yaml@0d2a0752d4c618907d735af4a7c12a9214c8517e # nwarila-platform/.github main @ 2026-06-06
    with:
      source_ref: 0d2a0752d4c618907d735af4a7c12a9214c8517e
