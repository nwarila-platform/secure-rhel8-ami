name: "PR Verify"

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Branch Promotion Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ACTIONLINT_VERSION: "1.7.8"
      ACTIONLINT_TAR_SHA256: "be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a"
      PACKER_VERSION: "1.15.0"
      PACKER_ZIP_SHA256: "2fd1149c5c6c7604ced64d7b56638af05f6b7ed3f6835182bc913ddaba1f16b8"
      PKR_VAR_aws_region: us-east-1
      PKR_VAR_deploy_user_name: ec2-user
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Validation Tooling
        run: |
          set -euo pipefail

          actionlint_base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          packer_base_url="https://releases.hashicorp.com/packer/${PACKER_VERSION}"

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "${actionlint_base_url}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          printf '%s  %s\n' "${ACTIONLINT_TAR_SHA256}" /tmp/actionlint.tar.gz | sha256sum -c -

          rm -rf /tmp/actionlint-bin
          mkdir -p /tmp/actionlint-bin
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint-bin
          sudo install -m 0755 /tmp/actionlint-bin/actionlint /usr/local/bin/actionlint

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "${packer_base_url}/packer_${PACKER_VERSION}_linux_amd64.zip" \
            -o /tmp/packer.zip
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "${packer_base_url}/packer_${PACKER_VERSION}_SHA256SUMS" \
            -o /tmp/packer_SHA256SUMS

          grep -E \
            "^${PACKER_ZIP_SHA256}[[:space:]]+packer_${PACKER_VERSION}_linux_amd64\\.zip$" \
            /tmp/packer_SHA256SUMS >/dev/null
          printf '%s  %s\n' "${PACKER_ZIP_SHA256}" /tmp/packer.zip | sha256sum -c -

          rm -rf /tmp/packer-bin
          unzip -oq /tmp/packer.zip -d /tmp/packer-bin
          sudo install -m 0755 /tmp/packer-bin/packer /usr/local/bin/packer

          python3 -m pip install --upgrade --disable-pip-version-check pip
          python3 -m pip install --disable-pip-version-check --no-input \
            ansible-core==2.16.14 \
            pre-commit==4.5.1 \
            PyYAML==6.0.3

          packer version
          actionlint -version
          ansible-playbook --version
          pre-commit --version

      - name: Run actionlint
        run: |
          set -euo pipefail
          actionlint

      - name: Run Repo-Local Gates
        run: |
          set -euo pipefail
          pre-commit run --all-files

      - name: Checkout Ansible Framework Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          path: ansible-framework
          persist-credentials: false
          ref: e8b2b95ead21c56da13ac1b41fe54569a69a2977
          repository: nwarila-platform/ansible-framework

      # The build matrix in packer.yaml names an image folder, a profile file and a Packer
      # source per entry. Packer treats the profile path as an opaque string, so a missing or
      # malformed profile would pass packer validate and fail only when Ansible reads it in a
      # build. This step therefore checks the matrix against the tree, parses every profile
      # through Ansible, and validates every image's inputs against both sources from packer/,
      # the directory the build runs Packer from.
      - name: Validate Images
        working-directory: ${{ github.workspace }}/packer
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible-framework/ansible.cfg
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Every matrix entry must point at files that exist and a source the template defines.
          python3 - "${GITHUB_WORKSPACE}" <<'PY'
          import pathlib
          import sys

          import yaml

          root = pathlib.Path(sys.argv[1])
          workflow = yaml.safe_load((root / ".github/workflows/packer.yaml").read_text())
          entries = workflow["jobs"]["packer"]["strategy"]["matrix"]["include"]
          sources = {"amazon-ebssurrogate.packer_image", "amazon-ebs.packer_image"}
          problems = []
          for entry in entries:
              image, profile, source = entry["image"], entry["profile"], entry["source"]
              for required in (
                  root / "images" / image / f"{image}.pkrvars.hcl",
                  root / "images" / image / "playbook.yml",
                  root / "images" / image / "profiles" / f"{profile}.yml",
              ):
                  if not required.is_file():
                      problems.append(f"matrix entry {image}/{profile}: missing {required.relative_to(root)}")
              if source not in sources:
                  problems.append(f"matrix entry {image}/{profile}: unknown source {source}")
          if not entries:
              problems.append("the build matrix has no entries")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

          packer init .

          images=(../images/*/)
          [ "${#images[@]}" -gt 0 ] || { echo "::error::no image folders under images/" >&2; exit 1; }

          for image_dir in "${images[@]}"; do
            image="$(basename "${image_dir}")"
            vars_file="../images/${image}/${image}.pkrvars.hcl"
            [ -f "${vars_file}" ] || { echo "::error::${image}: no ${image}.pkrvars.hcl" >&2; exit 1; }

            profiles=("../images/${image}"/profiles/*.yml)
            [ "${#profiles[@]}" -gt 0 ] || { echo "::error::${image}: no profiles" >&2; exit 1; }

            for profile in "${profiles[@]}"; do
              # Ansible parses the profile file here, so a missing or malformed one fails the
              # pull request instead of the build.
              ansible-playbook --syntax-check -i localhost, -c local \
                --extra-vars "@${profile}" "../images/${image}/playbook.yml"
              packer validate \
                -var-file="${vars_file}" \
                -var="ansible_extra_vars_file=${profile}" .
            done
          done
