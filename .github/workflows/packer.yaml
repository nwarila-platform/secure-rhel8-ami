name: "Packer Build (AWS)"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packer/**
      - .github/workflows/packer.yaml

permissions:
  contents: read

concurrency:
  group: packer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  packer:
    # Auto-build on push to main is gated behind the PACKER_BUILD_ENABLED repo
    # variable so merging a packer change does not attempt an AMI build before
    # the GitHub OIDC role (AWS_PACKER_ROLE_ARN) and the packer-build
    # environment secrets are confirmed configured. Set
    # vars.PACKER_BUILD_ENABLED=true (or run workflow_dispatch) for a live build.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || vars.PACKER_BUILD_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: packer-build
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      PACKER_VERSION: "1.15.0"
      PACKER_ZIP_SHA256: "2fd1149c5c6c7604ced64d7b56638af05f6b7ed3f6835182bc913ddaba1f16b8"
      PKR_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      PKR_VAR_deploy_user_name: ${{ vars.DEPLOY_USER_NAME || 'ec2-user' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Packer CLI
        run: |
          set -euo pipefail

          packer_base_url="https://releases.hashicorp.com/packer/${PACKER_VERSION}"

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "${packer_base_url}/packer_${PACKER_VERSION}_linux_amd64.zip" \
            -o /tmp/packer.zip
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "${packer_base_url}/packer_${PACKER_VERSION}_SHA256SUMS" \
            -o /tmp/packer_SHA256SUMS

          grep -E \
            "^${PACKER_ZIP_SHA256}[[:space:]]+packer_${PACKER_VERSION}_linux_amd64\\.zip$" \
            /tmp/packer_SHA256SUMS >/dev/null
          printf '%s  %s\n' "${PACKER_ZIP_SHA256}" /tmp/packer.zip | sha256sum -c -

          rm -rf /tmp/packer-bin
          unzip -oq /tmp/packer.zip -d /tmp/packer-bin
          sudo install -m 0755 /tmp/packer-bin/packer /usr/local/bin/packer
          packer version

      - name: Install Ansible
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade --disable-pip-version-check pip
          python3 -m pip install --disable-pip-version-check --no-input \
            ansible-core==2.16.14
          ansible-playbook --version

      - name: Checkout Packer Framework Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          path: aws-packer-framework
          persist-credentials: false
          # feat: hard-block BIOS, UEFI-only surrogate (#4)
          # Post-purge SHA: the ADR-0010 history rewrite replaced every commit id in
          # aws-packer-framework, orphaning the previous pin. Same tree, new id.
          ref: 3e3384d894db260b7d5268174b489a0d8f37f0a3
          repository: nwarila-platform/aws-packer-framework

      - name: Checkout Ansible Framework Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          path: ansible-framework
          persist-credentials: false
          ref: e8b2b95ead21c56da13ac1b41fe54569a69a2977
          repository: nwarila-platform/ansible-framework

      - name: Validate Runtime Dependencies
        run: |
          set -euo pipefail

          required_variables=(
            "PKR_VAR_aws_region"
            "PKR_VAR_deploy_user_name"
          )

          for variable_name in "${required_variables[@]}"; do
            variable_value="${!variable_name:-}"
            if [[ -z "${variable_value//[[:space:]]/}" ]]; then
              echo "Required environment variable is not set: ${variable_name}" >&2
              exit 1
            fi
          done

          required_commands=(
            "ansible-playbook"
            "aws"
            "curl"
            "git"
            "packer"
            "python3"
            "sha256sum"
            "unzip"
          )

          for command_name in "${required_commands[@]}"; do
            if ! command -v "${command_name}" >/dev/null 2>&1; then
              echo "Required executable not found: ${command_name}" >&2
              exit 1
            fi
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PACKER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: secure-rhel8-ami-build

      - name: Verify AWS Identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Sync Consumer Files Into Framework Checkout
        run: |
          set -euo pipefail

          destination_dir="${GITHUB_WORKSPACE}/aws-packer-framework/packer"

          cp -f "${GITHUB_WORKSPACE}/packer/systems.auto.pkrvars.hcl" "${destination_dir}/"
          cp -f "${GITHUB_WORKSPACE}/packer/user-data.pkrtpl.hcl" "${destination_dir}/"
          cp -f "${GITHUB_WORKSPACE}/packer/rhel-8.yml" "${destination_dir}/"

      - name: Packer Init
        working-directory: ${{ github.workspace }}/aws-packer-framework/packer
        run: |
          set -euo pipefail
          packer init .

      - name: Packer Validate and Build
        working-directory: ${{ github.workspace }}/aws-packer-framework/packer
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible-framework/ansible.cfg
        run: |
          set -euo pipefail

          packer validate .
          packer build -timestamp-ui -color=false \
            -only=amazon-ebssurrogate.packer_image . | tee packer-build.log

      - name: Generate SBOM and Vulnerability Report
        working-directory: ${{ github.workspace }}/aws-packer-framework/packer
        env:
          SYFT_VERSION: v1.50.0
          SYFT_INSTALL_REF: 16223e6dd7893fe578787658ceb876257483d404
          GRYPE_VERSION: v0.116.1
          GRYPE_INSTALL_REF: 30394f177175da63ae36b35cdd809c248eb4de7f
        run: |
          set -euo pipefail

          test -f evidence/rpm-manifest.tsv

          # Unpack the image rpm database for the SPDX cataloger.
          mkdir -p evidence/rpmdb-root
          tar -xzf evidence/rpmdb.tar.gz -C evidence/rpmdb-root

          # Anchore installers pinned by release commit; each installer verifies the
          # published checksums of the binary it downloads.
          mkdir -p /tmp/tools
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_INSTALL_REF}/install.sh" \
            | sh -s -- -b /tmp/tools "${SYFT_VERSION}"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-connrefused --connect-timeout 15 \
            "https://raw.githubusercontent.com/anchore/grype/${GRYPE_INSTALL_REF}/install.sh" \
            | sh -s -- -b /tmp/tools "${GRYPE_VERSION}"

          /tmp/tools/syft scan dir:evidence/rpmdb-root \
            -o spdx-json=evidence/sbom.spdx.json \
            -o table=evidence/sbom-table.txt

          /tmp/tools/grype sbom:evidence/sbom.spdx.json -o json > evidence/vulnerabilities.json
          /tmp/tools/grype sbom:evidence/sbom.spdx.json -o table > evidence/vulnerabilities.txt

          python3 - "${GITHUB_STEP_SUMMARY}" <<'PY'
          import collections
          import json
          import sys

          matches = json.load(open("evidence/vulnerabilities.json"))["matches"]

          # An SBOM carrying no distro identity matches nothing at all, so a clean report is
          # indistinguishable from a broken scanner. Assert Red Hat advisory data was
          # actually consulted before believing any number below.
          namespaces = {m["vulnerability"]["namespace"] for m in matches}
          if not any(n.startswith("redhat") for n in namespaces):
              sys.exit(f"Scan produced no Red Hat advisory matches; namespaces seen: {namespaces}")

          # Fixable = Red Hat published a patched build this image does not have, so a
          # rebuild resolves it. The rest are tracked-but-unfixed upstream and cannot be.
          fixable = [m for m in matches
                     if m["vulnerability"].get("fix", {}).get("state") == "fixed"]
          fix_counts = collections.Counter(m["vulnerability"]["severity"] for m in fixable)
          all_counts = collections.Counter(m["vulnerability"]["severity"] for m in matches)
          worst = sorted({(m["vulnerability"]["id"], m["artifact"]["name"],
                           m["vulnerability"]["severity"])
                          for m in fixable
                          if m["vulnerability"]["severity"] in ("Critical", "High")})[:10]

          with open(sys.argv[1], "a") as handle:
              handle.write("## Vulnerability summary\n\n")
              handle.write("| Severity | Fixable (patch available) | All tracked |\n")
              handle.write("|---|---:|---:|\n")
              for severity in ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]:
                  if all_counts.get(severity):
                      handle.write(
                          f"| {severity} | {fix_counts.get(severity, 0)} "
                          f"| {all_counts[severity]} |\n"
                      )
              unique = len({m["vulnerability"]["id"] for m in fixable})
              handle.write(f"\n**{unique} unique fixable CVEs.**\n")
              if worst:
                  handle.write("\nTop fixable Critical/High:\n\n")
                  for cve, package, severity in worst:
                      handle.write(f"- `{cve}` {severity} - {package}\n")

          # A fixable Critical or High means Red Hat published a patch this image does not
          # carry, which the build could have taken and did not. That is a defect in the
          # artifact, not a fact about the world, so it fails here rather than being
          # published and reported. Severities below High and anything upstream has not
          # fixed are reported only: no rebuild resolves them, and failing on them would
          # make the gate noise people route around.
          blocking = sorted({
              (m["vulnerability"]["id"], m["artifact"]["name"])
              for m in fixable
              if m["vulnerability"]["severity"] in ("Critical", "High")
          })
          if blocking:
              with open(sys.argv[1], "a") as handle:
                  handle.write(
                      f"\n### Build failed: {len(blocking)} fixable Critical/High\n\n"
                      "Red Hat has published a fix for each of these that this image does "
                      "not carry.\n\n"
                  )
                  for cve, package in blocking:
                      handle.write(f"- `{cve}` - {package}\n")
              for cve, package in blocking:
                  print(f"::error::fixable {cve} in {package}")
              sys.exit(f"{len(blocking)} fixable Critical/High findings")
          PY

      - name: SBOM Gate
        id: gate
        working-directory: ${{ github.workspace }}/aws-packer-framework/packer
        env:
          IMAGE_FAMILY: rhel
          VERSION_SLOTS: "8.10"
          # Matches the RepositoryId stamped by the Packer inventory; it is what bounds every
          # tag-conditioned grant in the build policy, so snapshot cleanup can only ever
          # reach resources this repository created.
          REPOSITORY_ID: "1326894519"
        run: |
          set -euo pipefail

          # Candidate AMI from the packer manifest; upstream source AMI from the log.
          ami_id="$(python3 - <<'PY'
          import glob
          import json

          path = sorted(glob.glob("manifests/*.json"))[-1]
          manifest = json.load(open(path))
          builds = [b for b in manifest["builds"] if b["packer_run_uuid"] == manifest["last_run_uuid"]]
          print(builds[-1]["artifact_id"].split(":")[1])
          PY
          )"
          source_ami="$(grep -m1 -oE 'Found Image ID: ami-[0-9a-f]+' packer-build.log | grep -oE 'ami-[0-9a-f]+')"

          # change-key = built truth (package set) + every input that shapes the image
          # invisibly to rpm: upstream source AMI, consumer packer tree, framework and
          # ansible-framework checkouts. Tree hash, not commit SHA: docs-only commits
          # must not mint a new image.
          manifest_sha="$(sha256sum evidence/rpm-manifest.tsv | cut -d ' ' -f 1)"
          consumer_tree="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD:packer)"
          framework_sha="$(git -C "${GITHUB_WORKSPACE}/aws-packer-framework" rev-parse HEAD)"
          ansible_sha="$(git -C "${GITHUB_WORKSPACE}/ansible-framework" rev-parse HEAD)"
          change_key="$(printf '%s\n' \
            "${manifest_sha}" "${source_ami}" "${consumer_tree}" \
            "${framework_sha}" "${ansible_sha}" | sha256sum | cut -d ' ' -f 1)"

          aws ec2 describe-images --owners self \
            --filters "Name=tag:ImageFamily,Values=${IMAGE_FAMILY}" "Name=state,Values=available" \
            --output json > /tmp/family-images.json
          previous_key="$(python3 - "${ami_id}" /tmp/family-images.json <<'PY'
          import json
          import sys

          images = json.load(open(sys.argv[2]))["Images"]
          previous = sorted(
              (i for i in images if i["ImageId"] != sys.argv[1]),
              key=lambda i: i["CreationDate"],
          )
          key = ""
          if previous:
              tags = {t["Key"]: t["Value"] for t in previous[-1].get("Tags", [])}
              key = tags.get("ImageChangeKey", "")
          print(key)
          PY
          )"

          mapfile -t snapshot_ids < <(aws ec2 describe-images --image-ids "${ami_id}" \
            --query 'Images[0].BlockDeviceMappings[].Ebs.SnapshotId' --output text | tr '\t' '\n')

          if [ -n "${previous_key}" ] && [ "${previous_key}" = "${change_key}" ]; then
            # Nothing changed: reap the candidate so identical images are never
            # republished and consumers never rebuild for zero value.
            aws ec2 deregister-image --image-id "${ami_id}"
            for snapshot_id in "${snapshot_ids[@]}"; do
              aws ec2 delete-snapshot --snapshot-id "${snapshot_id}"
            done
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## SBOM gate: no change"
              echo ""
              echo "Candidate \`${ami_id}\` matched change-key \`${change_key}\` of the"
              echo "current image. Candidate and snapshots reaped; nothing published."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            # The candidate is a candidate only. Nothing is stamped until it has proved
            # itself on a live boot: an image that never boots passes every check that
            # reads the filesystem, and 7 of this project's first 8 images did exactly
            # that. Publishing happens after the canary, not here.
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            {
              echo "ami_id=${ami_id}"
              echo "change_key=${change_key}"
              echo "previous_key=${previous_key:-none}"
              echo "snapshot_ids=${snapshot_ids[*]}"
            } >> "${GITHUB_OUTPUT}"
          fi

          # The surrogate builder snapshots the assembled volume twice but RegisterImage
          # references only one, so every build leaves the other behind. Deleting by AMI
          # reference alone therefore never reaches it, and the strays accumulate for the
          # life of the account. Delete every snapshot this repository owns that no image
          # references - which also covers the reaped candidate half.
          aws ec2 describe-snapshots --owner-ids self \
            --filters "Name=tag:RepositoryId,Values=${REPOSITORY_ID}" \
            --query 'Snapshots[].SnapshotId' --output text | tr '\t' '\n' > /tmp/owned-snapshots
          aws ec2 describe-images --owners self \
            --query 'Images[].BlockDeviceMappings[].Ebs.SnapshotId' --output text \
            | tr '\t' '\n' | sort -u > /tmp/referenced-snapshots
          orphans="$(comm -23 <(sort -u /tmp/owned-snapshots) /tmp/referenced-snapshots)"
          for snapshot_id in ${orphans}; do
            [ -n "${snapshot_id}" ] || continue
            aws ec2 delete-snapshot --snapshot-id "${snapshot_id}" \
              && echo "reaped unreferenced snapshot ${snapshot_id}"
          done

      # An image that never boots satisfies every check that reads a filesystem, and 7 of
      # this project's first 8 images did exactly that: green build, dead image. The only
      # proof that an image works is launching it, so nothing is published until a throwaway
      # instance built from the candidate has booted and reported on itself.
      #
      # The instance gets no keypair and no ingress rule; everything it reports travels out
      # through the serial console, which needs no network path to the runner.
      - name: Canary Boot Verification
        id: canary
        if: steps.gate.outputs.publish == 'true'
        env:
          CANDIDATE_AMI: ${{ steps.gate.outputs.ami_id }}
          SUBNET_ID: ${{ vars.CANARY_SUBNET_ID || 'subnet-01a8835a525008dfc' }}
          VPC_ID: ${{ vars.CANARY_VPC_ID || 'vpc-024afb5e25a56792c' }}
          REPOSITORY_ID: "1326894519"
        run: |
          set -euo pipefail

          cat > /tmp/canary-user-data.sh <<'CANARY'
          #!/bin/bash
          exec >/dev/console 2>&1
          echo "=====CANARY-START====="
          fail=0

          [ -d /sys/firmware/efi ] && echo "PASS:efi-boot" || { echo "FAIL:efi-boot"; fail=1; }

          for target in /boot /boot/efi /home /opt /tmp /var /var/tmp /var/log /var/log/audit; do
            findmnt -no TARGET,SOURCE,OPTIONS "${target}" \
              || { echo "FAIL:not-mounted:${target}"; fail=1; }
          done
          for target in /tmp /var/tmp /var/log /var/log/audit; do
            findmnt -no OPTIONS "${target}" | grep -q noexec \
              || { echo "FAIL:noexec-missing:${target}"; fail=1; }
          done

          for keyfile in /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys; do
            [ -s "${keyfile}" ] && { echo "FAIL:authorized-keys:${keyfile}"; fail=1; }
          done
          id packer >/dev/null 2>&1 && { echo "FAIL:packer-user"; fail=1; } \
            || echo "PASS:no-build-user"

          # The kernel the patched image actually booted, against the newest it ships. A
          # mismatch means the default boot entry points at a superseded kernel, which is
          # how a patched image silently runs unpatched.
          running="$(uname -r)"
          newest="$(ls /lib/modules | sort -V | tail -1)"
          echo "kernel-running:${running} kernel-newest:${newest}"
          [ "${running}" = "${newest}" ] && echo "PASS:newest-kernel-booted" \
            || { echo "FAIL:stale-kernel-booted"; fail=1; }

          # The five STIG rules the offline scan cannot answer are all systemd service
          # state, which exists only on a running system. Evaluate exactly those here, with
          # the same scanner and datastream the offline pass uses, so the profile result is
          # complete rather than 96 percent complete.
          if dnf install -y -q openscap-scanner scap-security-guide >/dev/null 2>&1; then
            oscap xccdf eval \
              --profile xccdf_org.ssgproject.content_profile_stig \
              --rule xccdf_org.ssgproject.content_rule_service_sshd_enabled \
              --rule xccdf_org.ssgproject.content_rule_service_auditd_enabled \
              --rule xccdf_org.ssgproject.content_rule_service_rsyslog_enabled \
              --rule xccdf_org.ssgproject.content_rule_service_kdump_disabled \
              --rule xccdf_org.ssgproject.content_rule_service_debug-shell_disabled \
              /usr/share/xml/scap/ssg/content/ssg-rhel8-ds.xml 2>/dev/null \
              | grep -E '^(Title|Result)' | paste - - | sed 's/^/OSCAP-RUNTIME:/'
            echo "OSCAP-RUNTIME:complete"
          else
            echo "OSCAP-RUNTIME:unavailable"
          fi

          [ "${fail}" = 0 ] && echo "CANARY-RESULT:PASS" || echo "CANARY-RESULT:FAIL"
          echo "=====CANARY-END====="
          CANARY

          # The build role may only launch into a security group carrying this repository id,
          # so the canary brings its own rather than falling back to the VPC default. It has
          # no ingress rules at all: the canary is never connected to, it only reports out
          # through the serial console.
          group_id="$(aws ec2 create-security-group \
            --group-name "canary-secure-rhel8-${GITHUB_RUN_ID}" \
            --description "Egress-only group for the secure-rhel8 boot canary" \
            --vpc-id "${VPC_ID}" \
            --tag-specifications "ResourceType=security-group,Tags=[\
          {Key=Name,Value=canary-secure-rhel8},\
          {Key=RepositoryId,Value=${REPOSITORY_ID}}]" \
            --query 'GroupId' --output text)"
          echo "group_id=${group_id}" >> "${GITHUB_OUTPUT}"

          instance_id="$(aws ec2 run-instances \
            --image-id "${CANDIDATE_AMI}" --instance-type t3.medium \
            --subnet-id "${SUBNET_ID}" --security-group-ids "${group_id}" \
            --metadata-options \
              'HttpTokens=required,HttpEndpoint=enabled,HttpPutResponseHopLimit=1' \
            --user-data "file:///tmp/canary-user-data.sh" \
            --tag-specifications "ResourceType=instance,Tags=[\
          {Key=Name,Value=canary-secure-rhel8},\
          {Key=RepositoryId,Value=${REPOSITORY_ID}},\
          {Key=RunId,Value=${GITHUB_RUN_ID}}]" \
            --query 'Instances[0].InstanceId' --output text)"
          echo "instance_id=${instance_id}" >> "${GITHUB_OUTPUT}"
          echo "canary instance ${instance_id} launched from ${CANDIDATE_AMI}"

          verdict="TIMEOUT"
          for _ in $(seq 1 30); do
            sleep 20
            aws ec2 get-console-output --instance-id "${instance_id}" --latest \
              --output text > /tmp/canary-console.log 2>/dev/null || true
            if grep -q 'CANARY-END' /tmp/canary-console.log; then
              verdict="$(grep -o 'CANARY-RESULT:[A-Z]*' /tmp/canary-console.log | tail -1)"
              break
            fi
          done

          mkdir -p evidence
          sed -n '/CANARY-START/,/CANARY-END/p' /tmp/canary-console.log \
            > evidence/canary-console.log || true
          {
            echo "## Canary boot verification"
            echo ""
            echo '```'
            cat evidence/canary-console.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          [ "${verdict}" = "CANARY-RESULT:PASS" ] || {
            echo "::error::canary verdict ${verdict} for ${CANDIDATE_AMI}"
            exit 1
          }

      # Publishing is the assertion that this image works, so it happens only after the
      # canary has proved it. A failed canary skips this step, leaving the candidate
      # unstamped and reaped below - the floating image keeps pointing at the last image
      # that actually booted.
      - name: Publish Verified Image
        if: steps.gate.outputs.publish == 'true' && steps.canary.outcome == 'success'
        env:
          AMI_ID: ${{ steps.gate.outputs.ami_id }}
          CHANGE_KEY: ${{ steps.gate.outputs.change_key }}
          PREVIOUS_KEY: ${{ steps.gate.outputs.previous_key }}
          SNAPSHOT_IDS: ${{ steps.gate.outputs.snapshot_ids }}
          VERSION_SLOTS: "8.10"
        run: |
          set -euo pipefail

          image_version="${VERSION_SLOTS}.$(date -u +%Y%m%d)"
          commit_sha="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          # shellcheck disable=SC2086
          aws ec2 create-tags --resources "${AMI_ID}" ${SNAPSHOT_IDS} --tags \
            "Key=ImageChangeKey,Value=${CHANGE_KEY}" \
            "Key=ImageVersion,Value=${image_version}" \
            "Key=CommitSha,Value=${commit_sha}" \
            "Key=RunId,Value=${GITHUB_RUN_ID}"
          {
            echo "## Published: canary-verified image"
            echo ""
            echo "- AMI: \`${AMI_ID}\` (ImageVersion \`${image_version}\`)"
            echo "- change-key: \`${CHANGE_KEY}\` (previous: \`${PREVIOUS_KEY}\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Always: terminate the canary, and reap a candidate that failed verification so a
      # broken image leaves neither a running instance nor an unreferenced AMI behind.
      - name: Reap Canary and Unverified Candidate
        if: always() && steps.gate.outputs.publish == 'true'
        env:
          AMI_ID: ${{ steps.gate.outputs.ami_id }}
          SNAPSHOT_IDS: ${{ steps.gate.outputs.snapshot_ids }}
          INSTANCE_ID: ${{ steps.canary.outputs.instance_id }}
          GROUP_ID: ${{ steps.canary.outputs.group_id }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
        run: |
          set -euo pipefail

          if [ -n "${INSTANCE_ID}" ]; then
            aws ec2 terminate-instances --instance-ids "${INSTANCE_ID}" \
              --query 'TerminatingInstances[0].CurrentState.Name' --output text
            # The group cannot be deleted while the instance still holds an interface in it.
            aws ec2 wait instance-terminated --instance-ids "${INSTANCE_ID}"
          fi

          if [ -n "${GROUP_ID}" ]; then
            aws ec2 delete-security-group --group-id "${GROUP_ID}"
          fi

          if [ "${CANARY_OUTCOME}" != "success" ]; then
            aws ec2 deregister-image --image-id "${AMI_ID}"
            for snapshot_id in ${SNAPSHOT_IDS}; do
              aws ec2 delete-snapshot --snapshot-id "${snapshot_id}"
            done
            echo "reaped unverified candidate ${AMI_ID}"
          fi

      - name: Upload Build Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence
          path: ${{ github.workspace }}/aws-packer-framework/packer/evidence
          if-no-files-found: warn

      - name: Upload Packer Build Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packer-build-diagnostics
          path: |
            ${{ github.workspace }}/aws-packer-framework/packer/packer-build.log
            ${{ github.workspace }}/aws-packer-framework/packer/manifests
          if-no-files-found: warn
          retention-days: 14
