---
# ============================================================================================= #
# RHEL 8 Build Playbook                                                                        #
#                                                                                               #
# Consumer playbook for the AWS Packer Framework Ansible provisioner, in two plays:             #
#                                                                                               #
#   1. Bootstrap — runs the ansible-framework os_bootstrap dispatcher against the booted        #
#      build instance (RedHat-family hosts route to RedHat_Rocky_8, whose strict assertion      #
#      accepts RHEL/Rocky 8). Hardening roles are layered here as they land; everything this    #
#      play changes is copied into the image by play 2.                                         #
#                                                                                               #
#   2. Surrogate image assembly — partitions the blank surrogate volume into the org's STIG     #
#      layout (mirroring proxmox-packer-framework's UEFI Kickstart layout: EFI system         #
#      partition + /boot + LVM sysvg with separate /home /opt /tmp /var /var/tmp /var/log      #
#      /var/log/audit), copies the configured root in with credential/state excludes, installs  #
#      shim+grub2-efi, and leaves the volume ready for amazon-ebssurrogate to register (UEFI).  #
#      the volume ready for the framework's amazon-ebssurrogate source to register as the AMI.  #
#      The excludes are the zero-persistent-credential guarantee: no authorized_keys, no SSH    #
#      host keys, no machine-id, no cloud-init state, and no build logs survive into the AMI.   #
#                                                                                               #
# gather_facts: false is required by the os_bootstrap dispatcher: play-level implicit           #
# gathering runs before role tasks and would break fresh Windows hosts; keep connection and     #
# privilege variables in inventory, not vars, so the selected bootstrap role applies its own    #
# task-scoped transport and privilege settings.                                                 #
# ============================================================================================= #

- name: Wait For Cloud-Init and Ensure a Module Interpreter
  hosts: all
  gather_facts: false
  become: true
  tasks:
    # Packer's SSH connect races cloud-init's package stage, and stock RHEL 8 AMIs ship
    # only platform-python. raw needs no interpreter, so it can settle first boot and
    # guarantee /usr/bin/python3 before any real module runs.
    - name: Wait for cloud-init to finish first boot
      ansible.builtin.raw: timeout 300 cloud-init status --wait || true
      changed_when: false

    # RHEL 8 targets pin the controller to ansible-core 2.16 (the last series with
    # python-3.6 target support): dnf-module bindings exist only for the platform-python
    # stack, so a newer interpreter cannot run package tasks. Discovery resolves
    # platform-python natively; installing python3 is belt-and-braces for anything that
    # shells out to an unversioned python3.
    - name: Ensure python3 is present for Ansible modules
      ansible.builtin.raw: command -v /usr/bin/python3 >/dev/null 2>&1 || dnf install -y python3
      changed_when: false

    # Packer's Ansible proxy adapter serves SFTP by executing /usr/lib/sftp-server on the
    # target, but RHEL ships it at /usr/libexec/openssh/sftp-server — without this link the
    # first module transfer dies with "bash: /usr/lib/sftp-server: No such file or directory"
    # (same normalization secure-rockylinux9-template carries).
    - name: Normalize the SFTP server path for the build transport
      ansible.builtin.raw: |
        set -e
        if [ -x /usr/libexec/openssh/sftp-server ] && [ ! -e /usr/lib/sftp-server ]; then
          ln -s /usr/libexec/openssh/sftp-server /usr/lib/sftp-server
        fi
      changed_when: false

- name: RHEL 8 Bootstrap and Hardening
  hosts: all
  gather_facts: false
  become: false
  tasks:
    # The published image baselines on the newest packages Red Hat offers, not on whatever
    # the source AMI froze at GA. Without this the image ships with every erratum released
    # since that snapshot still outstanding - the first scan of an unpatched build found 24
    # CVEs with a published fix. Patching before the bootstrap role means it configures
    # services at the versions the image will actually run.
    #
    # Everything this changes is copied into the image by the assembly play, so a new kernel
    # arriving here is expected; that play drops the superseded kernel, regenerates the
    # initramfs, and pins the default entry to what remains.
    #
    # The transaction restarts NetworkManager and sshd, which drops the SSH session Ansible
    # is holding: run it synchronously and the play dies UNREACHABLE partway through, with
    # the target left mid-update. Detaching it puts the transaction outside the session, so
    # a dropped connection costs a reconnect rather than the build.
    - name: Baseline the image on the latest available packages
      ansible.builtin.dnf:
        name: '*'
        state: latest
        update_cache: true
      become: true
      async: 2700
      poll: 0
      register: patch_job

    - name: Reconnect after the update restarts networking and sshd
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 600

    - name: Wait for the package baseline to finish
      ansible.builtin.async_status:
        jid: "{{ patch_job.ansible_job_id }}"
      become: true
      register: patch_baseline
      until: patch_baseline.finished
      retries: 90
      delay: 30

    - name: Bootstrap this host
      ansible.builtin.include_role:
        name: 'os_bootstrap'

- name: STIG Partition Surrogate Volume and Assemble Image
  hosts: all
  gather_facts: false
  become: true
  vars:
    sysimage: /mnt/sysimage

    # Packages the published image has no use for. Each was checked against the built rpmdb
    # for dependents before being listed, and dnf removes those dependents with it - naming
    # subscription-manager is what takes insights-client, rhc, and
    # redhat-cloud-client-configuration with it. rh-amazon-rhui-client requires none of them
    # (only dnf, python3-requests, and amazon-libdnf-plugin), so package installation on a
    # deployed host is unaffected.
    rhel8_image_strip_packages:
      # ~1GB of firmware blobs for physical hardware no instance has. Nothing requires it.
      - linux-firmware
      # CPU microcode and software RAID: both the hypervisor's concern, not the guest's.
      - microcode_ctl
      - mdadm
      # Tuning daemon and kernel profiling tools, neither of which a server image needs.
      - tuned
      - kernel-tools
      - kernel-tools-libs
      # Red Hat SaaS registration and telemetry. Each is a network-talking service in an
      # image meant to be inert until Ansible configures it.
      - subscription-manager
      - dnf-plugin-subscription-manager
      # Link aggregation and a curses network UI.
      - NetworkManager-team
      - NetworkManager-tui
      # Manual page infrastructure, alongside the documentation removed below.
      - man-db
      # Needed to ASSEMBLE this image, never to run it. rsync in particular has no business
      # in a baseline: it is a capable network transfer tool sitting in every instance.
      - rsync
      - parted
  tasks:
    - name: Install imaging tooling (also lands in the image, which needs lvm2 to boot)
      ansible.builtin.shell: |
        set -euo pipefail
        dnf install -y lvm2 parted e2fsprogs rsync dosfstools grub2-efi-x64 shim-x64 \
          efibootmgr grubby
      changed_when: true

    - name: Resolve the blank surrogate disk (the only unmounted, unpartitioned disk)
      ansible.builtin.shell: |
        set -euo pipefail
        root_disk="/dev/$(lsblk -no PKNAME "$(findmnt -no SOURCE /)")"
        surrogate=""
        for disk in $(lsblk -dnpo NAME,TYPE | awk '$2=="disk"{print $1}'); do
          [ "${disk}" = "${root_disk}" ] && continue
          if [ "$(lsblk -no MOUNTPOINTS "${disk}" | sed '/^$/d' | wc -l)" -eq 0 ]; then
            surrogate="${disk}"
            break
          fi
        done
        [ -n "${surrogate}" ] || { echo "no surrogate disk found" >&2; exit 1; }
        echo "${surrogate}"
      register: surrogate_disk
      changed_when: false

    - name: Record surrogate device path
      ansible.builtin.set_fact:
        surrogate_dev: "{{ surrogate_disk.stdout_lines[-1] }}"

    - name: Partition surrogate disk (GPT — EFI system partition, /boot, LVM PV)
      ansible.builtin.shell: |
        set -euo pipefail
        parted -s "{{ surrogate_dev }}" mklabel gpt
        parted -s "{{ surrogate_dev }}" mkpart EFI fat32 1MiB 513MiB
        parted -s "{{ surrogate_dev }}" set 1 esp on
        parted -s "{{ surrogate_dev }}" mkpart boot ext4 513MiB 1537MiB
        parted -s "{{ surrogate_dev }}" mkpart pv 1537MiB 100%
        udevadm settle
      changed_when: true

    - name: Create STIG LVM layout and filesystems (labels mirror the Kickstart layout)
      ansible.builtin.shell: |
        set -euo pipefail
        case "{{ surrogate_dev }}" in
          *nvme*) p="{{ surrogate_dev }}p" ;;
          *)      p="{{ surrogate_dev }}"  ;;
        esac
        pvcreate -ff -y "${p}3"
        vgcreate sysvg "${p}3"
        lvcreate -y -L 1G    -n lv_swap      sysvg
        lvcreate -y -L 10G   -n lv_root     sysvg
        lvcreate -y -L 4G    -n lv_home     sysvg
        lvcreate -y -L 2G    -n lv_opt      sysvg
        lvcreate -y -L 4G    -n lv_tmp      sysvg
        lvcreate -y -L 2G    -n lv_var      sysvg
        lvcreate -y -L 1G    -n lv_var_tmp  sysvg
        lvcreate -y -L 4G    -n lv_var_log  sysvg
        lvcreate -y -L 500M  -n lv_var_audit sysvg
        mkfs.vfat -F32 -n EFIFS      "${p}1"
        mkfs.ext4 -q -F -L BOOTFS    "${p}2"
        mkfs.ext4 -q -F -L ROOTFS    /dev/sysvg/lv_root
        mkfs.ext4 -q -F -L HOMEFS    /dev/sysvg/lv_home
        mkfs.ext4 -q -F -L OPTFS     /dev/sysvg/lv_opt
        mkfs.ext4 -q -F -L TMPFS     /dev/sysvg/lv_tmp
        mkfs.ext4 -q -F -L VARFS     /dev/sysvg/lv_var
        mkfs.ext4 -q -F -L VARTMPFS  /dev/sysvg/lv_var_tmp
        mkfs.ext4 -q -F -L VARLOGFS  /dev/sysvg/lv_var_log
        mkfs.ext4 -q -F -L AUDITFS   /dev/sysvg/lv_var_audit
        mkswap -L SWAPFS /dev/sysvg/lv_swap
      changed_when: true

    - name: Mount the target filesystem tree
      ansible.builtin.shell: |
        set -euo pipefail
        case "{{ surrogate_dev }}" in
          *nvme*) p="{{ surrogate_dev }}p" ;;
          *)      p="{{ surrogate_dev }}"  ;;
        esac
        mkdir -p {{ sysimage }}
        mount /dev/sysvg/lv_root {{ sysimage }}
        mkdir -p {{ sysimage }}/boot {{ sysimage }}/home {{ sysimage }}/opt \
                 {{ sysimage }}/tmp {{ sysimage }}/var
        mount "${p}2"                {{ sysimage }}/boot
        mkdir -p {{ sysimage }}/boot/efi
        mount "${p}1"                {{ sysimage }}/boot/efi
        mount /dev/sysvg/lv_home    {{ sysimage }}/home
        mount /dev/sysvg/lv_opt     {{ sysimage }}/opt
        mount /dev/sysvg/lv_tmp     {{ sysimage }}/tmp
        mount /dev/sysvg/lv_var     {{ sysimage }}/var
        mkdir -p {{ sysimage }}/var/tmp {{ sysimage }}/var/log
        mount /dev/sysvg/lv_var_tmp {{ sysimage }}/var/tmp
        mount /dev/sysvg/lv_var_log {{ sysimage }}/var/log
        mkdir -p {{ sysimage }}/var/log/audit
        mount /dev/sysvg/lv_var_audit {{ sysimage }}/var/log/audit
      changed_when: true

    - name: Copy the configured root into the STIG layout (credential/state excludes)
      ansible.builtin.shell: |
        set -euo pipefail
        rsync -aAXH --numeric-ids \
          --exclude=/dev/'*' --exclude=/proc/'*' --exclude=/sys/'*' --exclude=/run/'*' \
          --exclude=/mnt/'*' --exclude=/media/'*' --exclude=/tmp/'*' --exclude=/var/tmp/'*' \
          --exclude=/lost+found \
          --exclude=/boot/efi/'*' \
          --exclude=/home/'*'/.ssh --exclude=/root/.ssh \
          --exclude=/etc/ssh/ssh_host_'*' \
          --exclude=/var/lib/cloud/'*' \
          --exclude=/var/lib/systemd/random-seed \
          --exclude=/var/log/'*' \
          / {{ sysimage }}/
        chmod 1777 {{ sysimage }}/tmp {{ sysimage }}/var/tmp
        chmod 0700 {{ sysimage }}/var/log/audit
      changed_when: true

    - name: Write the target fstab with STIG mount options
      ansible.builtin.copy:
        dest: "{{ sysimage }}/etc/fstab"
        owner: root
        group: root
        mode: "0644"
        content: |
          LABEL=ROOTFS    /               ext4  defaults                            1 1
          LABEL=BOOTFS    /boot           ext4  defaults,nodev,nosuid               1 2
          LABEL=EFIFS     /boot/efi       vfat  umask=0077,shortname=winnt,nodev,nosuid 0 2
          LABEL=HOMEFS    /home           ext4  defaults,nodev,noexec,nosuid 1 2
          LABEL=OPTFS     /opt            ext4  defaults,nodev               1 2
          LABEL=TMPFS     /tmp            ext4  defaults,nodev,noexec,nosuid 1 2
          LABEL=VARFS     /var            ext4  defaults,nodev               1 2
          LABEL=VARTMPFS  /var/tmp        ext4  defaults,nodev,noexec,nosuid 1 2
          LABEL=VARLOGFS  /var/log        ext4  defaults,nodev,noexec,nosuid 1 2
          LABEL=AUDITFS   /var/log/audit  ext4  defaults,nodev,noexec,nosuid 1 2
          LABEL=SWAPFS    none            swap  defaults                     0 0
          # systemd mounts /dev/shm itself, with defaults, before anything reads this file.
          # Naming it here is what gets the restrictive options applied: shared memory is
          # world-writable, so without them it is an executable, device-capable directory
          # every account can write to.
          tmpfs           /dev/shm        tmpfs defaults,nodev,noexec,nosuid 0 0

    - name: Install bootloader and regenerate initramfs for the LVM root
      ansible.builtin.shell: |
        set -euo pipefail
        mount --rbind /dev  {{ sysimage }}/dev  && mount --make-rslave {{ sysimage }}/dev
        mount --rbind /sys  {{ sysimage }}/sys  && mount --make-rslave {{ sysimage }}/sys
        mount -t proc proc  {{ sysimage }}/proc

        # Kernels are install-only, so the update added the new one beside the old rather
        # than replacing it. Left in place the image ships a kernel it will never boot,
        # costing roughly 300MB and making every vulnerability report list the superseded
        # kernel as unpatched forever - the first patched build reported 11 High CVEs, all
        # of them fixed in the kernel it actually boots. Remove it from the assembled tree
        # only: the build instance is still running the old kernel and needs its modules to
        # finish the assembly. This runs before dracut and grub2-mkconfig below, so they see
        # exactly one kernel.
        chroot {{ sysimage }} dnf -y remove --oldinstallonly \
          --setopt installonly_limit=1 --setopt protect_running_kernel=false

        # Strip the image to what a server actually runs. Every package here either drives
        # hardware no instance has, phones a vendor, or was needed only to assemble this
        # volume - and unlike configuration, nothing about it can be recovered later: an
        # image that ships a gigabyte of firmware pays for it in every snapshot and every
        # launch, forever, and removing it after deployment shrinks neither.
        #
        # Order matters: this runs after the root has been copied in and before dracut, so
        # the initramfs is built against the package set that actually ships.
        # Removed one at a time and only when present: dnf fails the whole transaction on an
        # unknown name, and a blanket "|| true" would hide a removal that failed for a real
        # reason. Dependents come out with their dependency, which is why the subscription
        # and telemetry packages need only their root named here.
        for package in {{ rhel8_image_strip_packages | join(' ') }}; do
          if chroot {{ sysimage }} rpm -q "${package}" >/dev/null 2>&1; then
            chroot {{ sysimage }} dnf -y remove "${package}"
          fi
        done

        # Locales other than the one the platform standardises on: roughly 100MB of
        # translations for a machine with no interactive users.
        chroot {{ sysimage }} sh -c \
          'rpm -qa "glibc-langpack-*" | grep -vx "glibc-langpack-en-.*" | xargs -r dnf -y remove'

        # Keep it minimal on the way out too: without these, the first dnf install on a
        # deployed host quietly reintroduces the weak dependencies and documentation this
        # step just removed.
        chroot {{ sysimage }} sh -c \
          'grep -q "^install_weak_deps" /etc/dnf/dnf.conf || echo install_weak_deps=False >> /etc/dnf/dnf.conf'
        chroot {{ sysimage }} sh -c \
          'grep -q "^tsflags" /etc/dnf/dnf.conf || echo tsflags=nodocs >> /etc/dnf/dnf.conf'

        # Documentation already on disk, and the package metadata cache, which is stale the
        # moment the image is published.
        rm -rf {{ sysimage }}/usr/share/doc/* {{ sysimage }}/usr/share/man/* \
               {{ sysimage }}/usr/share/info/* {{ sysimage }}/var/cache/dnf/*

        existing_args="$(sed -n 's/^GRUB_CMDLINE_LINUX="\(.*\)"$/\1/p' {{ sysimage }}/etc/default/grub)"
        kernel_args="root=/dev/mapper/sysvg-lv_root ro rd.lvm.lv=sysvg/lv_root ${existing_args}"
        sed -i "s|^GRUB_CMDLINE_LINUX=.*|GRUB_CMDLINE_LINUX=\"rd.lvm.lv=sysvg/lv_root ${existing_args}\"|" \
          {{ sysimage }}/etc/default/grub

        # UEFI install: RHEL ships the signed EFI binaries via grub2-efi-x64 + shim-x64
        # into /boot/efi/EFI/redhat/. grubx64.efi is built with prefix /EFI/redhat, so it
        # reads /boot/efi/EFI/redhat/grub.cfg wherever it is launched from.
        mount -t efivarfs efivarfs {{ sysimage }}/sys/firmware/efi/efivars 2>/dev/null || true
        chroot {{ sysimage }} dnf reinstall -y grub2-efi-x64 shim-x64 || \
          chroot {{ sysimage }} dnf install -y grub2-efi-x64 shim-x64
        # Patching installs a new kernel beside the old one, and the root filesystem is an LV,
        # so every kernel that can be selected needs an initramfs carrying the LVM module -
        # not just the newest. A kernel left with the source AMI initramfs cannot find the
        # root volume and halts in the initramfs shell.
        for kver in $(chroot {{ sysimage }} sh -c 'ls /lib/modules'); do
          chroot {{ sysimage }} dracut -f --add lvm "/boot/initramfs-${kver}.img" "${kver}"
        done

        newest_kver="$(chroot {{ sysimage }} sh -c 'ls /lib/modules' | sort -V | tail -1)"
        chroot {{ sysimage }} grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg

        # The saved default is inherited from the build instance, which is still running the
        # pre-patch kernel, so without this the patched image would boot the older one it
        # shipped alongside. Pin it to the newest installed kernel explicitly.
        chroot {{ sysimage }} grubby --set-default "/boot/vmlinuz-${newest_kver}"
        chroot {{ sysimage }} grub2-editenv /boot/efi/EFI/redhat/grubenv set kernelopts="${kernel_args}"

        # The BLS entries were copied from the source image, where /boot lives on the root
        # filesystem, so their paths carry a /boot prefix. Here /boot is a separate partition
        # and GRUB resolves the paths relative to that partition, where the kernel sits at
        # /vmlinuz-*; without stripping the prefix the kernel is never found and boot halts
        # at the GRUB menu awaiting input. Entries written later by kernel updates on a
        # running system are unaffected: grubby writes partition-relative paths when /boot
        # is a mountpoint. (No apostrophes in this block: ansible free-form arg splitting.)
        sed -i 's|^linux /boot/|linux /|; s|^initrd /boot/|initrd /|' \
          {{ sysimage }}/boot/loader/entries/*.conf

        # AWS UEFI firmware boots a freshly registered AMI (empty NVRAM) via the removable
        # media path /EFI/BOOT/BOOTX64.EFI. Populate it from the signed RHEL binaries so the
        # image boots without a pre-seeded boot entry: shim as BOOTX64.EFI, plus grubx64 and
        # the Mok manager it chainloads.
        install -d -m 0700 {{ sysimage }}/boot/efi/EFI/BOOT
        cp -f {{ sysimage }}/boot/efi/EFI/redhat/shimx64.efi {{ sysimage }}/boot/efi/EFI/BOOT/BOOTX64.EFI
        cp -f {{ sysimage }}/boot/efi/EFI/redhat/grubx64.efi {{ sysimage }}/boot/efi/EFI/BOOT/grubx64.efi
        cp -f {{ sysimage }}/boot/efi/EFI/redhat/mmx64.efi \
          {{ sysimage }}/boot/efi/EFI/BOOT/mmx64.efi 2>/dev/null || true

        # SELinux stays enforcing; relabel the copied tree on first boot.
        touch {{ sysimage }}/.autorelabel
      changed_when: true

    - name: Generate build evidence from the assembled image
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p /tmp/evidence

        # Canonical package manifest and the SBOM gate input: sorted NEVRA lines with no
        # headers, so byte-identical package sets hash identically across builds.
        chroot {{ sysimage }} rpm -qa --qf "%{NAME}\t%{EPOCHNUM}:%{VERSION}-%{RELEASE}\t%{ARCH}\n" \
          | sort > /tmp/evidence/rpm-manifest.tsv

        # The rpm database plus the distro identity files, for SPDX SBOM generation on the
        # runner. The identity files are not optional: without them syft cannot tell which
        # distribution the packages came from, emits bare CPEs instead of
        # pkg:rpm/redhat/...?distro=rhel-8.10 purls, and grype then has no Red Hat advisory
        # data to match - reporting zero vulnerabilities for any image, however old.
        tar -C {{ sysimage }} -czf /tmp/evidence/rpmdb.tar.gz \
          var/lib/rpm etc/os-release etc/redhat-release etc/system-release

        # OpenSCAP STIG evaluation of the assembled tree. Report-only until the hardening
        # roles land: oscap exits 2 when rules fail, which is expected and tolerated; any
        # other nonzero exit still fails the build. (No apostrophes in this block:
        # ansible free-form arg splitting.)
        dnf install -y openscap-scanner scap-security-guide
        rc=0
        oscap-chroot {{ sysimage }} xccdf eval \
          --profile xccdf_org.ssgproject.content_profile_stig \
          --results-arf /tmp/evidence/oscap-arf.xml \
          --report /tmp/evidence/oscap-report.html \
          /usr/share/xml/scap/ssg/content/ssg-rhel8-ds.xml || rc=$?
        if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ]; then exit "${rc}"; fi
      changed_when: true

    - name: Fetch build evidence to the workflow runner
      ansible.builtin.fetch:
        src: "/tmp/evidence/{{ item }}"
        dest: "{{ playbook_dir }}/evidence/{{ item }}"
        flat: true
      loop:
        - rpm-manifest.tsv
        - rpmdb.tar.gz
        - oscap-arf.xml
        - oscap-report.html

    - name: Scrub identity state and detach the assembled volume
      ansible.builtin.shell: |
        set -euo pipefail
        truncate -s 0 {{ sysimage }}/etc/machine-id
        sync
        umount -R {{ sysimage }} || { sleep 3; umount -R {{ sysimage }}; } || umount -R -l {{ sysimage }}
        udevadm settle
        # Deactivation is belt-and-braces: Packer stops the instance before snapshotting,
        # which flushes everything. A transient holder (udev scan) can keep the LV open
        # briefly right after umount, so retry and then tolerate.
        deactivated=no
        for attempt in 1 2 3 4 5; do
          if vgchange -an sysvg; then deactivated=yes; break; fi
          sleep 3
        done
        [ "${deactivated}" = "yes" ] || echo "vgchange -an did not succeed; relying on instance stop to flush"
        sync
      changed_when: true
